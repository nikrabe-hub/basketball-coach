name: Debug-APK bauen

# Läuft bei jedem Push auf main und kann auch von Hand gestartet werden
# (GitHub -> Reiter "Actions" -> "Debug-APK bauen" -> "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests der Spiel-Engine
        run: npm test

      - name: Web-App bauen
        run: npm run build

      - name: Web-App in das Android-Projekt kopieren
        run: npx cap sync android

      - name: Debug-APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: basketball-coach-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
